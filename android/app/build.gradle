plugins { id 'com.android.application'; id 'com.chaquo.python' }
def signingProperties = new Properties()
def signingFile=rootProject.file('signing.properties')
if(signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
android {
    namespace 'org.aiteacher.offline'
    compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'org.aiteacher.offline'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.8.1'
        ndk { abiFilters (project.findProperty('mobileAbi') ?: 'arm64-v8a') }
    }
    sourceSets { main { assets.srcDirs += ['../generated/assets'] } }
    signingConfigs {
        release {
            if(signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes { release { minifyEnabled false; if(signingFile.exists()) signingConfig signingConfigs.release } }
}
chaquopy {
    defaultConfig {
        version '3.12'
        extractPackages 'app'
        buildPython '../../.venv/bin/python'
        pip {
            options '--find-links', rootProject.file('wheels').absolutePath
            install 'fastapi==0.135.2'
            install 'uvicorn==0.41.0'
            install 'httpx[socks]==0.28.1'
            install 'pydantic==2.13.5'
            install 'pydantic-settings==2.13.1'
            install 'python-multipart==0.0.22'
            install 'pillow==11.0.0'
            install 'pypdf==6.9.0'
            install 'reportlab==4.4.10'
            install 'tzdata==2026.2'
        }
    }
    sourceSets { main { srcDirs = ['src/main/python', '../generated/python'] } }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
